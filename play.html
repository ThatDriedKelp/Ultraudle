<!DOCTYPE html>
<html>
<head>
  <link rel="icon" type="image/png" href="UltrakidleIcon.png">
  <title>ULTRAUDLE /// STANDARD</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="standard">

<div id="crt">

  <div id="gameUI">

    <h1>ULTRAUDLE /// STANDARD</h1>

    <div class="frame">
      <canvas id="waveform"></canvas>
    </div>

    <div id="playsLeft" class="plays-ui"></div>

    <button id="playBtn" type="button">Play</button>
    
    <input id="guess" placeholder="Guess">

    <div id="suggestions"></div>

    <div id="history"></div>

    <p id="result"></p>

    <button type="button" onclick="checkGuess()">Guess</button>

  </div>

  <div id="flash"></div>

  <div id="resultUI" style="display:none;"></div>

  <div id="underConstruction" style="display:none;">
    UNDER CONSTRUCTION
  </div>

</div>

<script src="shared.js"></script>
<script src="app.js"></script>

</body>
</html>
